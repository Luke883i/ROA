name: iKant runner tests

on:
  push:
    branches: ["**"]
    paths:
      - "IKANT_ROA_ACCESS_CONTRACT.md"
      - "Operation/runner/**"
      - "Operation/MANIFEST.json"
      - "Operation/SEMANTIC_RETICULUM.json"
      - "Operation/iKANT_PROMPT.md"
      - "Operation/governance/CHAT_RUNTIME_V2.md"
      - "Operation/governance/chat_runtime_100k_receipt.json"
      - "Operation/governance/simulate_chat_runtime.js"
      - ".github/workflows/ikant-runner.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "IKANT_ROA_ACCESS_CONTRACT.md"
      - "Operation/runner/**"
      - "Operation/MANIFEST.json"
      - "Operation/SEMANTIC_RETICULUM.json"
      - "Operation/iKANT_PROMPT.md"
      - "Operation/governance/CHAT_RUNTIME_V2.md"
      - "Operation/governance/chat_runtime_100k_receipt.json"
      - "Operation/governance/simulate_chat_runtime.js"
      - ".github/workflows/ikant-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run iKant runner and chat-runtime tests
        run: node --test Operation/runner/test/*.test.js
      - name: Verify persisted 100k chat-runtime receipt
        run: node Operation/governance/simulate_chat_runtime.js --check
